# Xerolux 2026
services:
  idm-logger:
    image: ghcr.io/xerolux/idm-metrics-collector:latest
    container_name: idm-logger
    restart: unless-stopped
    ports:
      - "5008:5000"
    volumes:
      - idm-data:/app/data
      - vm-data:/storage  # For VictoriaMetrics backup (direct volume access)
    depends_on:
      - victoriametrics
    labels:
      - "com.centurylinklabs.watchtower.scope=idm-updates"
    environment:
      - INTERNAL_API_KEY=change_me_secure_key
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  victoriametrics:
    image: victoriametrics/victoria-metrics:latest
    container_name: idm-victoriametrics
    restart: unless-stopped
    ports:
      - "8428:8428"
    volumes:
      - vm-data:/storage
    command:
      - "-storageDataPath=/storage"
      - "-retentionPeriod=1y"

  ml-service:
    image: ghcr.io/xerolux/idm-metrics-collector-ml:latest
    container_name: idm-ml-service
    restart: unless-stopped
    depends_on:
      - victoriametrics
      - idm-logger
    labels:
      - "com.centurylinklabs.watchtower.scope=idm-updates"
    volumes:
      - ml-model-data:/app/data
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 512M
    environment:
      - METRICS_URL=http://victoriametrics:8428
      - IDM_LOGGER_URL=http://idm-logger:5000
      - INTERNAL_API_KEY=change_me_secure_key
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  vm-data:
    name: idm-vm-data
  idm-data:
    name: idm-logger-data
  ml-model-data:
    name: idm-ml-model-data
