# Xerolux 2026
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        if [ -f telemetry_server/requirements.txt ]; then pip install -r telemetry_server/requirements.txt; fi
        pip install pytest-asyncio pytest

    - name: Lint with Ruff
      run: |
        ruff check .
        ruff format --check .

    - uses: pnpm/action-setup@v4
      with:
        version: 9

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        # No cache to ensure fresh builds

    - name: Install Frontend Dependencies
      working-directory: frontend
      run: pnpm install

    - name: Build Frontend
      working-directory: frontend
      run: pnpm run build

    - name: Security Hardening Checks
      run: |
        python telemetry_server/scripts/check_prod_security.py

    - name: Run Root Tests
      run: |
        if ls tests/test_*.py >/dev/null 2>&1; then
          pytest -q tests
        else
          echo "No root tests found."
        fi

    - name: Run Telemetry Tests
      working-directory: telemetry_server
      run: |
        mkdir -p /tmp/telemetry/{tokens,installations,permissions,audit,tasks}
        TOKEN_STORAGE_DIR=/tmp/telemetry/tokens \
        INSTALLATION_STORAGE_DIR=/tmp/telemetry/installations \
        PERMISSION_STORAGE_DIR=/tmp/telemetry/permissions \
        AUDIT_LOG_DIR=/tmp/telemetry/audit \
        TASK_STORAGE_DIR=/tmp/telemetry/tasks \
        PYTHONPATH=.. python -m pytest -q tests/

  frontend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
    - uses: actions/checkout@v4

    - uses: pnpm/action-setup@v4
      with:
        version: 9

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        # No cache to ensure fresh builds

    - name: Install dependencies
      run: pnpm install

    - name: Lint
      run: pnpm run lint

    - name: Build
      run: pnpm run build
