# Xerolux 2026
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_mode:
        description: 'Release mode'
        required: true
        default: 'latest'
        type: choice
        options:
          - latest
          - auto-bump
          - custom
      custom_version:
        description: 'Custom version (only for "custom" mode, e.g. v1.2.3)'
        required: false
        type: string

permissions:
  contents: write
  packages: write

jobs:
  prepare:
    name: Determine version
    runs-on: ubuntu-latest
    outputs:
      docker_tag: ${{ steps.resolve.outputs.docker_tag }}
      app_version: ${{ steps.resolve.outputs.app_version }}
      is_latest: ${{ steps.resolve.outputs.is_latest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: resolve
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
            echo "docker_tag=${TAG}" >> $GITHUB_OUTPUT
            echo "app_version=${VERSION}" >> $GITHUB_OUTPUT
            echo "is_latest=false" >> $GITHUB_OUTPUT

          elif [[ "${{ inputs.release_mode }}" == "latest" ]]; then
            SHA=$(git rev-parse --short HEAD)
            BASE=$(cat VERSION | tr -d '[:space:]')
            echo "docker_tag=latest" >> $GITHUB_OUTPUT
            echo "app_version=${BASE}+dev.${SHA}" >> $GITHUB_OUTPUT
            echo "is_latest=true" >> $GITHUB_OUTPUT

          elif [[ "${{ inputs.release_mode }}" == "auto-bump" ]]; then
            CURRENT=$(cat VERSION | tr -d '[:space:]')
            MAJOR=$(echo "$CURRENT" | cut -d. -f1)
            MINOR=$(echo "$CURRENT" | cut -d. -f2)
            PATCH=$(echo "$CURRENT" | cut -d. -f3)
            NEW_PATCH=$((PATCH + 1))
            NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
            NEW_TAG="v${NEW_VERSION}"
            echo "docker_tag=${NEW_TAG}" >> $GITHUB_OUTPUT
            echo "app_version=${NEW_VERSION}" >> $GITHUB_OUTPUT
            echo "is_latest=false" >> $GITHUB_OUTPUT

          elif [[ "${{ inputs.release_mode }}" == "custom" ]]; then
            INPUT="${{ inputs.custom_version }}"
            VERSION="${INPUT#v}"
            echo "docker_tag=v${VERSION}" >> $GITHUB_OUTPUT
            echo "app_version=${VERSION}" >> $GITHUB_OUTPUT
            echo "is_latest=false" >> $GITHUB_OUTPUT
          fi

      - name: Auto-bump VERSION file and tag
        if: inputs.release_mode == 'auto-bump'
        run: |
          CURRENT=$(cat VERSION | tr -d '[:space:]')
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3)
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
          NEW_TAG="v${NEW_VERSION}"
          echo "${NEW_VERSION}" > VERSION
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "Bump version to ${NEW_VERSION}"
          git tag "${NEW_TAG}"
          git push origin main --tags

  build-main:
    name: Build Main App
    needs: prepare
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ secrets.DOCKER_USERNAME }}/idm-metrics-collector
          tags: |
            type=ref,event=tag
            type=raw,value=${{ needs.prepare.outputs.docker_tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push (Multi-Arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          pull: true
          push: true
          build-args: |
            APP_VERSION=${{ needs.prepare.outputs.app_version }}
            CACHEBUST=${{ github.run_id }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:latest
          cache-to: type=inline

  build-ml:
    name: Build ML Service
    needs: prepare
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}-ml
            ${{ secrets.DOCKER_USERNAME }}/idm-metrics-collector-ml
          tags: |
            type=ref,event=tag
            type=raw,value=${{ needs.prepare.outputs.docker_tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push ML Service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ml_service/Dockerfile
          push: true
          build-args: |
            APP_VERSION=${{ needs.prepare.outputs.app_version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          platforms: linux/amd64,linux/arm64

  build-telemetry:
    name: Build Telemetry Server
    needs: prepare
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}-telemetry
            ${{ secrets.DOCKER_USERNAME }}/idm-metrics-collector-telemetry
          tags: |
            type=ref,event=tag
            type=raw,value=${{ needs.prepare.outputs.docker_tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push Telemetry Server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: telemetry_server/Dockerfile
          push: true
          build-args: |
            APP_VERSION=${{ needs.prepare.outputs.app_version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          platforms: linux/amd64,linux/arm64
