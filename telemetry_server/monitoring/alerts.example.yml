groups:
  - name: telemetry-security
    interval: 30s
    rules:
      - alert: TelemetryHigh401Rate
        expr: sum(increase(telemetry_security_events_total{event_type="auth_401"}[5m])) > 50
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High 401 rate on telemetry server"
          description: "More than 50 unauthorized requests in 5 minutes."

      - alert: TelemetryHigh403Rate
        expr: sum(increase(telemetry_security_events_total{event_type="auth_403"}[5m])) > 30
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High 403 rate on telemetry server"
          description: "More than 30 forbidden requests in 5 minutes."

      - alert: TelemetryHigh429Rate
        expr: sum(increase(telemetry_security_events_total{event_type="rate_limit_429"}[5m])) > 30
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High 429 rate on telemetry server"
          description: "More than 30 rate-limit responses in 5 minutes."

      - alert: TelemetryAdminTrafficSpike
        expr: sum(increase(telemetry_admin_requests_total[5m])) > 200
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Admin API traffic spike"
          description: "More than 200 requests to /api/v1/admin/* in 5 minutes."

      - alert: TelemetryErrorRateHigh
        expr: |
          (
            sum(increase(telemetry_http_responses_total{status_code=~"5.."}[5m]))
            /
            clamp_min(sum(increase(telemetry_http_responses_total[5m])), 1)
          ) > 0.05
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "High 5xx error ratio"
          description: "5xx ratio exceeded 5% over the last 5 minutes."
